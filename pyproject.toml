[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "embedify"
version = "1.0.0"
description = "Embed any data — files, documents, code — for RAG and agentic systems"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.11"
authors = [{ name = "InfraMatrix" }]
keywords = ["embeddings", "rag", "vector-search", "lancedb"]
classifiers = [
  "Development Status :: 5 - Production/Stable",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
]
dependencies = [
  "httpx>=0.27",
  "PyYAML>=6.0",
  "typer>=0.12",
]

[project.optional-dependencies]
local = ["sentence-transformers>=3.0"]
pdf = ["pypdf>=4.0"]
lancedb = ["lancedb>=0.13", "pyarrow>=16"]
parquet = ["pyarrow>=16"]
docx = ["python-docx>=1.1"]
tabular = ["pyarrow>=16", "openpyxl>=3.1"]
excel = ["openpyxl>=3.1"]
timeseries = []
code = [
  "tree-sitter>=0.22",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-go>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-c>=0.21",
  "tree-sitter-cpp>=0.22",
]
server = ["fastapi>=0.111", "uvicorn>=0.30"]
dev = [
  "pytest>=8.0",
  "pytest-cov>=5.0",
  "ruff>=0.5",
  "mypy>=1.10",
  "pypdf>=4.0",
]
all = [
  "sentence-transformers>=3.0",
  "pypdf>=4.0",
  "lancedb>=0.13",
  "pyarrow>=16",
  "openpyxl>=3.1",
  "python-docx>=1.1",
  "tree-sitter>=0.22",
  "tree-sitter-python>=0.23",
  "tree-sitter-javascript>=0.21",
  "tree-sitter-typescript>=0.21",
  "tree-sitter-go>=0.21",
  "tree-sitter-rust>=0.21",
  "tree-sitter-java>=0.21",
  "tree-sitter-c>=0.21",
  "tree-sitter-cpp>=0.22",
  "fastapi>=0.111",
  "uvicorn>=0.30",
]

[project.scripts]
embedify = "embedify.cli:app"

[project.urls]
Homepage = "https://github.com/InfraMatrix/embedify"
Repository = "https://github.com/InfraMatrix/embedify"
Issues = "https://github.com/InfraMatrix/embedify/issues"

[tool.hatch.build.targets.wheel]
packages = ["src/embedify"]

[tool.ruff]
target-version = "py311"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
